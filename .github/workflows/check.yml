name: check
on:
  push:
    branches: [main]
  pull_request:
  # update.yml dispatches this after pushing a bump to main: a push
  # made with the workflow token starts nothing on its own.
  workflow_dispatch:
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate Nix: the action has
          # defaulted determinate to true since v21, and this
          # project targets the Nix everyone else runs.
          determinate: false
      # Builds the overlaid nbd, proving the pinned release still
      # autoreconfs and compiles against the nixpkgs pin.
      - run: nix flake check -L
