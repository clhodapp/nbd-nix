# This workflow fails until clhodapp/ch-nixpkgs is public, and the
# failure is environmental rather than a fault in the build. A run's
# GITHUB_TOKEN is scoped to this repository alone, so fetching the
# ch-nixpkgs flake input gets a 404 from the GitHub tarball API. The
# same `nix flake check -L` passes locally for anyone holding
# credentials for that repo, and this goes green on its own once
# ch-nixpkgs flips. It is deliberately not marked continue-on-error:
# a check that always reports success would stop telling the truth
# about the build once the fetch starts working.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate Nix: the action has
          # defaulted determinate to true since v21, and this
          # project targets the Nix everyone else runs.
          determinate: false
      # Builds the overlaid nbd, proving the pinned upstream-master
      # source still autoreconfs and compiles against the nixpkgs pin.
      - run: nix flake check -L
