# SPDX-License-Identifier: MIT
#
# Follows upstream without anyone bumping by hand. Every run moves the
# `nbd` input to upstream's latest release when that is newer than the
# tag it names, and the `nbd-unstable` input to the head of upstream's
# default branch; then it proves the result with the flake checks and
# pushes the advance to main. The overlay reads both versions from the
# lock, so flake.nix and flake.lock are the whole change.
#
# A push made with the workflow's own token starts no other workflow,
# so the two that a push to main would have started are dispatched at
# the end instead: check.yml, which builds main again, and
# notify-workspace.yml, which asks the workspace to converge its
# consumers onto the new pins.
#
# A run that finds main moved under it (its push is refused as a
# non-fast-forward) fails and leaves the advance to the next run.

name: update

on:
  schedule:
    # Daily, off the hour. A run with nothing to do installs Nix, reads
    # the release and the branch head, and stops, in about a minute.
    - cron: "41 6 * * *"
  workflow_dispatch:

# Pushing the advance; dispatching check.yml and notify-workspace.yml.
permissions:
  contents: write
  actions: write

# Two runs at once could both find the same pins and race to push.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, as in check.yml.
          determinate: false

      # GitHub's "latest release" is the newest release that is neither
      # a draft nor a prerelease, so neither upstream's old v1.x tags
      # nor a prerelease is a candidate. The version sort guards
      # against a "latest" that sorts below the current tag.
      - name: Advance the inputs
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          moved=()

          current=$(jq -r '.nodes.nbd.original.ref' flake.lock)
          latest=$(gh api repos/NetworkBlockDevice/nbd/releases/latest --jq .tag_name)
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [[ "$latest" != "$current" && "$newest" == "$latest" ]]; then
            echo "nbd $current becomes $latest."
            sed -i -E "s|(nbd\.url = \"github:NetworkBlockDevice/nbd/)[^\"]+|\1$latest|" flake.nix
            grep -q "nbd/$latest\"" flake.nix
            nix flake update nbd
            [[ "$(jq -r '.nodes.nbd.original.ref' flake.lock)" == "$latest" ]]
            moved+=("nbd ${current#nbd-} -> ${latest#nbd-}")
          else
            echo "nbd $current is upstream's latest release."
          fi

          before=$(jq -r '.nodes."nbd-unstable".locked.rev' flake.lock)
          nix flake update nbd-unstable
          after=$(jq -r '.nodes."nbd-unstable".locked.rev' flake.lock)
          if [[ "$before" != "$after" ]]; then
            echo "nbd-unstable ${before:0:12} becomes ${after:0:12}."
            moved+=("nbd-unstable ${before:0:12} -> ${after:0:12}")
          else
            echo "nbd-unstable ${before:0:12} is the head of upstream's default branch."
          fi

          if [[ ${#moved[@]} -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff
          {
            echo "changed=true"
            echo "moved=$(printf '%s, ' "${moved[@]}" | sed 's/, $//')"
          } >> "$GITHUB_OUTPUT"

      - name: Run the flake checks against the advance
        if: steps.bump.outputs.changed == 'true'
        run: nix flake check -L

      - name: Push the advance to main
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOVED: ${{ steps.bump.outputs.moved }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "maint: advance pins ($MOVED)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
          echo "::notice::Pushed to main: $MOVED."

      # Both take main's head as their subject: check.yml with no inputs
      # builds main's own commit, and notify-workspace.yml passes the
      # head of the ref it was dispatched on.
      - name: Start the runs the push would have started
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run notify-workspace.yml --repo "$GITHUB_REPOSITORY" --ref main
