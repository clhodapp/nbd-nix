# SPDX-License-Identifier: MIT
#
# Follows upstream without anyone bumping by hand. Two inputs track two
# lines: `nbd` upstream's latest release, `nbd-unstable` the head of
# upstream's default branch. Every run asks GitHub where each line
# stands and, for each input behind its line, moves it (the release
# tag in flake.nix and the lock for `nbd`, the lock alone for
# `nbd-unstable`), proves the result by building that package's check,
# and commits the advance. The advances that pass are pushed to main
# together; an input whose advance fails its check stays where it was,
# and the run fails after the push, naming it. The overlay reads both
# versions from the lock, so flake.nix and flake.lock are the whole
# change.
#
# A push made with the workflow's own token starts no other workflow,
# so the two that a push to main would have started are dispatched at
# the end instead: check.yml, which builds main again, and
# notify-workspace.yml, which asks the workspace to converge its
# consumers onto the new pins.
#
# A run that finds main moved under it (its push is refused as a
# non-fast-forward) fails and leaves the advances to the next run.

name: update

on:
  schedule:
    # Daily, off the hour. A run with nothing to do installs Nix, reads
    # the release and the branch head, and stops, in about a minute.
    - cron: "41 6 * * *"
  workflow_dispatch:

# Pushing the advances; dispatching check.yml and notify-workspace.yml.
permissions:
  contents: write
  actions: write

# Two runs at once could both find the same pins and race to push.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, as in check.yml.
          determinate: false

      # GitHub's "latest release" is the newest release that is neither
      # a draft nor a prerelease, so neither upstream's old v1.x tags
      # nor a prerelease is a candidate. The version sort guards
      # against a "latest" that sorts below the current tag.
      - name: Advance each input to where its line stands
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          moved=()
          failed=()

          # Settles the advance of one line that the working tree
          # holds in the named files: builds the line's check, then
          # commits the files or puts them back.
          settle() {
            local line=$1 before=$2 after=$3
            shift 3
            git diff -- "$@"
            if nix build --print-build-logs --no-link ".#checks.x86_64-linux.$line"; then
              git commit -q -m "maint($line): $before -> $after" -- "$@"
              moved+=("$line $after")
              echo "$line $before becomes $after."
            else
              git checkout -- "$@"
              failed+=("$line $after")
              echo "::error::$line $after fails its check; $before stays."
            fi
          }

          current=$(jq -r '.nodes.nbd.original.ref' flake.lock)
          latest=$(gh api repos/NetworkBlockDevice/nbd/releases/latest --jq .tag_name)
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [[ "$latest" != "$current" && "$newest" == "$latest" ]]; then
            sed -i -E "s|(nbd\.url = \"github:NetworkBlockDevice/nbd/)[^\"]+|\1$latest|" flake.nix
            grep -q "nbd/$latest\"" flake.nix
            nix flake update nbd
            [[ "$(jq -r '.nodes.nbd.original.ref' flake.lock)" == "$latest" ]]
            settle nbd "${current#nbd-}" "${latest#nbd-}" flake.nix flake.lock
          else
            echo "nbd $current is upstream's latest release."
          fi

          before=$(jq -r '.nodes."nbd-unstable".locked.rev' flake.lock)
          nix flake update nbd-unstable
          after=$(jq -r '.nodes."nbd-unstable".locked.rev' flake.lock)
          if [[ "$before" != "$after" ]]; then
            settle nbd-unstable "${before:0:12}" "${after:0:12}" flake.lock
          else
            echo "nbd-unstable ${before:0:12} is the head of upstream's default branch."
          fi

          echo "moved=${moved[*]:-}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed[*]:-}" >> "$GITHUB_OUTPUT"

      - name: Push the advances to main
        if: steps.bump.outputs.moved != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MOVED: ${{ steps.bump.outputs.moved }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
          echo "::notice::Pushed to main: $MOVED."

      # Both take main's head as their subject: check.yml with no inputs
      # builds main's own commit, and notify-workspace.yml passes the
      # head of the ref it was dispatched on.
      - name: Start the runs the push would have started
        if: steps.bump.outputs.moved != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run notify-workspace.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Fail for the inputs that could not move
        if: steps.bump.outputs.failed != ''
        env:
          FAILED: ${{ steps.bump.outputs.failed }}
        run: |
          echo "::error::Held back by a failing check: $FAILED."
          exit 1
